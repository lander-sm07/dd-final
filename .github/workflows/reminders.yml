name: Discord reminders

on:
  schedule:
    - cron: "7 * * * *"   # every hour (GitHub may run it a few minutes late, that's normal)
  workflow_dispatch:       # lets you press "Run workflow" to test it
    inputs:
      force_digest:
        description: "Send the morning overview now (test)"
        type: boolean
        default: true

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/remind.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          FORCE_DIGEST: ${{ inputs.force_digest }}
